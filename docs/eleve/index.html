<!DOCTYPE html>
<html lang="fr" data-base="../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon espace élève — Technologie &amp; SNT</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lexend:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/styles.css?v=a3271703b2">
<script>(function(){try{var t=localStorage.getItem("lmtechno-theme");if(!t)t=window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<script src="../assets/firebase-config.js?v=a3271703b2"></script>
</head>
<body>
<header class="app-header">
  <div class="wrap">
    <a class="brand" href="../index.html"><span class="brand-logo">T</span><span>Mon espace</span></a>
    <span class="spacer"></span>
    <span class="student-badge" id="badge"></span>
    <button class="btn btn-ghost btn-sm" id="logout" type="button">Se déconnecter</button>
  </div>
</header>

<main class="app-main app-narrow">
  <div id="loading" style="text-align:center;color:var(--muted);padding:3rem">Chargement…</div>
  <div id="space" style="display:none">
    <div class="app-card">
      <h1 style="margin-top:0">Bonjour <span id="hello"></span> 👋</h1>
      <p style="color:var(--text-2)">Tes réponses et tes scores de quiz sont enregistrés ici : tu les retrouves sur n'importe quel appareil en te reconnectant.</p>
      <a class="btn btn-primary" href="../index.html">📚 Continuer mes cours</a>
    </div>
    <div class="app-card" id="group-card">
      <h2 style="margin-top:0">👥 Mon groupe d'îlot</h2>
      <div id="group-box">Chargement…</div>
    </div>
    <div class="app-card">
      <h2 style="margin-top:0">Ma progression</h2>
      <div id="progress"></div>
    </div>
  </div>
</main>

<script type="module">
import { isConfigured, currentStudent, logout, loadStudentWork,
  listGroups, createGroup, joinGroup, leaveGroup,
  listRoster, findMyGroup, setGroupMembers } from "../assets/app.js?v=a3271703b2";

const $ = (id) => document.getElementById(id);
if (!isConfigured()) { location.href = "../connexion/"; }
const sess = currentStudent();
if (!sess) { location.href = "../connexion/"; }

$("logout").onclick = async () => { await logout(); location.href = "../connexion/"; };

function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function scorePill(pct) {
  if (pct == null) return '<span class="pill-score none">—</span>';
  const cls = pct >= 80 ? "good" : pct >= 50 ? "mid" : "low";
  return `<span class="pill-score ${cls}">${pct}%</span>`;
}

(async () => {
  $("badge").textContent = "🎒 " + sess.firstName + (sess.className ? " · " + sess.className : "");
  $("hello").textContent = sess.firstName;
  try {
    const work = await loadStudentWork(sess.classId, sess.sid);
    $("loading").style.display = "none";
    $("space").style.display = "block";
    if (!work.length) {
      $("progress").innerHTML = '<p style="color:var(--muted)">Tu n\'as pas encore commencé. Ouvre une séance et réponds : tout se sauvegarde ici automatiquement.</p>';
      return;
    }
    work.sort((a, b) => (a.pageKey).localeCompare(b.pageKey));
    $("progress").innerHTML = `<div class="table-scroll"><table class="dash-table">
      <thead><tr><th>Séance</th><th class="num">Quiz</th><th class="num">Réponses</th></tr></thead>
      <tbody>${work.map((w) => {
        const q = w.quiz && w.quiz.total ? Math.round(w.quiz.score / w.quiz.total * 100) : null;
        const nb = w.answers ? Object.keys(w.answers).length : (w.groupAnswers || 0);
        return `<tr><td>${esc((w.title || w.pageKey).replace(/_/g, " "))}</td><td class="num">${scorePill(q)}</td><td class="num">${nb}</td></tr>`;
      }).join("")}</tbody></table></div>`;
  } catch (e) {
    $("loading").textContent = "Impossible de charger ta progression. Reconnecte-toi.";
  }
  renderGroup();
})();

/* ---------- Groupe d'îlot ---------- */

// Met à jour la session locale (un camarade a pu nous ajouter à un îlot).
function saveSession(patch) {
  try {
    const raw = JSON.parse(localStorage.getItem("lmtechno-eleve") || "null") || {};
    Object.assign(raw, patch);
    localStorage.setItem("lmtechno-eleve", JSON.stringify(raw));
  } catch (e) {}
}

// Cases à cocher des camarades (hors soi-même), pré-cochées selon `selected`.
function pickerHtml(roster, mySid, selected) {
  const others = roster.filter((r) => r.sid !== mySid);
  if (!others.length) {
    return '<p style="color:var(--muted);font-size:0.88rem">Aucun autre élève inscrit dans la classe pour l’instant.</p>';
  }
  return `<div class="chips" id="g-picker">${others.map((r) => `
    <label class="chip-student" style="cursor:pointer;user-select:none">
      <input type="checkbox" data-sid="${esc(r.sid)}" data-name="${esc(r.firstName)}"${selected && selected[r.sid] ? " checked" : ""} style="margin-right:0.35rem">
      ${esc(r.firstName)}
    </label>`).join("")}</div>`;
}

function pickedMembers() {
  const out = {};
  document.querySelectorAll("#g-picker input[data-sid]:checked").forEach((c) => {
    out[c.getAttribute("data-sid")] = c.getAttribute("data-name");
  });
  return out;
}

async function renderGroup() {
  const box = $("group-box");
  const s = currentStudent();

  // La base fait foi : si un camarade nous a ajoutés, on rejoint sans rien faire.
  let mine = null;
  try { mine = await findMyGroup(s.classId, s.sid); } catch (e) {}
  if (mine) saveSession({ groupId: mine.id, groupName: mine.name });
  else if (s.groupId) saveSession({ groupId: null, groupName: null });

  let roster = [];
  try { roster = await listRoster(s.classId); } catch (e) {}

  if (mine) {
    const members = Object.values(mine.members || {});
    box.innerHTML = `
      <p>Tu es dans l’îlot <strong>${esc(mine.name)}</strong>${members.length > 1 ? " avec : " + members.filter((m) => m !== s.firstName).map(esc).join(", ") : " (seul·e pour l’instant)"}.</p>
      <p style="color:var(--muted);font-size:0.88rem">Sur les pages de cours, ce que chacun écrit apparaît chez tous les membres de l’îlot, en direct. Votre professeur voit le travail de l’îlot.</p>
      <div style="display:flex;gap:0.5rem;flex-wrap:wrap">
        <button class="btn btn-ghost btn-sm" id="g-edit" type="button">✏️ Modifier les membres</button>
        <button class="btn btn-ghost btn-sm" id="g-leave" type="button">Quitter l’îlot</button>
      </div>
      <div id="g-editbox" style="margin-top:0.8rem"></div>
      <div class="app-msg err" id="g-msg"></div>`;
    $("g-leave").onclick = async () => {
      if (!confirm("Quitter l’îlot ? (les réponses de l’îlot sont conservées)")) return;
      await leaveGroup(s.classId, mine.id, s.sid);
      location.reload();
    };
    $("g-edit").onclick = () => {
      $("g-editbox").innerHTML = `
        <p style="font-weight:600;margin:0 0 0.4rem">Qui travaille dans cet îlot ?</p>
        ${pickerHtml(roster, s.sid, mine.members || {})}
        <button class="btn btn-primary btn-sm" id="g-save" type="button" style="margin-top:0.6rem">Enregistrer l’îlot</button>`;
      $("g-save").onclick = async () => {
        const msg = $("g-msg"); msg.className = "app-msg";
        $("g-save").disabled = true;
        try {
          await setGroupMembers(s.classId, mine.id, Object.assign(pickedMembers(), { [s.sid]: s.firstName }));
          location.reload();
        } catch (e) {
          msg.textContent = e.message || "Erreur."; msg.className = "app-msg show err"; $("g-save").disabled = false;
        }
      };
    };
    return;
  }

  // Pas d'îlot : en créer un (en choisissant ses camarades) ou en rejoindre un.
  let groups = [];
  try { groups = await listGroups(s.classId); } catch (e) {}
  box.innerHTML = `
    <p style="color:var(--text-2)">Travaille en îlot : crée l’îlot de ta table et <strong>coche les camarades qui y travaillent</strong> — ils n’ont rien à faire, ils le verront à leur connexion. Ce que chacun écrit apparaîtra chez tous, en direct.</p>
    <div class="field" style="max-width:320px"><label for="g-name">Nom de l’îlot</label>
      <input id="g-name" type="text" maxlength="40" placeholder="Les Fusées"></div>
    <p style="font-weight:600;margin:0.8rem 0 0.4rem">Qui travaille avec toi ?</p>
    ${pickerHtml(roster, s.sid, null)}
    <button class="btn btn-primary" id="g-create" type="button" style="margin-top:0.7rem">Créer l’îlot</button>
    ${groups.length ? `<p style="font-weight:600;margin:1.2rem 0 0.4rem">Ou rejoindre un îlot existant :</p>
    <div class="chips">${groups.map((g) => `<button class="chip-student" style="cursor:pointer" data-join="${esc(g.id)}" data-name="${esc(g.name)}">${esc(g.name)} · ${Object.keys(g.members || {}).length} membre${Object.keys(g.members || {}).length > 1 ? "s" : ""}</button>`).join("")}</div>` : ""}
    <div class="app-msg err" id="g-msg"></div>`;
  $("g-create").onclick = async () => {
    const name = $("g-name").value.trim();
    const msg = $("g-msg"); msg.className = "app-msg";
    if (!name) { msg.textContent = "Choisis un nom d’îlot."; msg.className = "app-msg show err"; return; }
    $("g-create").disabled = true;
    try { await createGroup(s.classId, name, s.sid, s.firstName, pickedMembers()); location.reload(); }
    catch (e) { msg.textContent = e.message || "Erreur."; msg.className = "app-msg show err"; $("g-create").disabled = false; }
  };
  box.querySelectorAll("[data-join]").forEach((b) => b.onclick = async () => {
    try { await joinGroup(s.classId, b.getAttribute("data-join"), s.sid, s.firstName); location.reload(); }
    catch (e) { const msg = $("g-msg"); msg.textContent = e.message || "Erreur."; msg.className = "app-msg show err"; }
  });
}
</script>
</body>
</html>
